{% if current_user.is_authenticated %}
<a href="{{ url_for('dashboard') }}"
    class="group flex items-center px-4 py-3 text-base font-medium rounded-xl transition-all duration-200 ease-in-out {% if request.endpoint == 'dashboard' %}bg-brand-600 text-white shadow-lg shadow-brand-900/20{% else %}text-sidebar-text hover:bg-sidebar-hover hover:text-white{% endif %}">
    <svg class="mr-4 flex-shrink-0 h-6 w-6 transition-colors {% if request.endpoint == 'dashboard' %}text-white{% else %}text-slate-400 group-hover:text-white{% endif %}"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
    </svg>
    Dashboard
</a>

<a href="{{ url_for('learning_path_form') }}"
    class="group flex items-center px-4 py-3 text-base font-medium rounded-xl transition-all duration-200 ease-in-out {% if 'learning-path' in request.path %}bg-brand-600 text-white shadow-lg shadow-brand-900/20{% else %}text-sidebar-text hover:bg-sidebar-hover hover:text-white{% endif %}">
    <svg class="mr-4 flex-shrink-0 h-6 w-6 transition-colors {% if 'learning-path' in request.path %}text-white{% else %}text-slate-400 group-hover:text-white{% endif %}"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />

</a>

<a href="{{ url_for('quiz_setup') }}"

    <svg class="mr-4 flex-shrink-0 h-6 w-6 transition-colors {% if 'quiz' in request.path %}text-white{% else %}text-slate-400 group-hover:text-white{% endif %}"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />

<a href="{{ url_for('resume_upload') }}"
    class="group flex items-center px-4 py-3 text-base font-medium rounded-xl transition-all duration-200 ease-in-out {% if 'resume' in request.path %}bg-brand-600 text-white shadow-lg shadow-brand-900/20{% else %}text-sidebar-text hover:bg-sidebar-hover hover:text-white{% endif %}">
    <svg class="mr-4 flex-shrink-0 h-6 w-6 transition-colors {% if 'resume' in request.path %}text-white{% else %}text-slate-400 group-hover:text-white{% endif %}"

{% else %}
<!-- Public Nav -->
<div class="mt-8 px-2 space-y-3">
    <a href="{{ url_for('index') }}"
        class="group flex items-center px-4 py-3 text-base font-medium rounded-xl text-sidebar-text hover:bg-sidebar-hover hover:text-white transition-all">
        Home
    </a>
    <a href="{{ url_for('login') }}"
        class="group flex items-center px-4 py-3 text-base font-medium rounded-xl text-sidebar-text hover:bg-sidebar-hover hover:text-white transition-all">
        Login
    </a>
    <a href="{{ url_for('signup') }}"
        class="mt-4 text-center w-full block px-6 py-3 border border-transparent rounded-xl shadow-lg text-base font-bold text-white bg-brand-600 hover:bg-brand-500 transition-all transform hover:-translate-y-1">
        Sign Up Free
    </a>
</div>
