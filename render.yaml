services:
  - type: web
    name: wayfinder-learning-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        value: change-me
      - key: GEMINI_API_KEY
        sync: false
